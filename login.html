<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>
<nav class="navbar">

    <a href="index.html">Home</a>

    <a href="events.html">Events</a>

</nav>
    <header>

        <h1>School Event Photo Portal</h1>

        <p>Admin Login</p>

    </header>


    <main>

        <h2>Admin Login</h2>


        <form id="loginForm">

            <label>Username</label>

            <br>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

            <br><br>


            <label>Password</label>

            <br>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <br><br>


            <button type="submit">
                Login
            </button>

        </form>


        <p id="loginMessage"></p>

    </main>


    <script>

        const loginForm =
            document.getElementById("loginForm");


        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;


                if (
                    username === "admin" &&
                    password === "admin123"
                ) {

                    localStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );


                   window.location.href =
                     "admin-dashboard.html";

                }

                else {

                    document.getElementById(
                        "loginMessage"
                    ).innerText =
                        "Invalid username or password.";

                }

            }
        );

    </script>

</body>

</html>
